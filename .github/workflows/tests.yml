name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Only the public repo runs CI; the private dev copy shares this file.
    if: github.repository_owner == 'HanamoriLabs'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run basedpyright qajev
      # Live tests drive a local Chrome (QAJEV_LIVE=1) and run before each release, not here.
      - run: uv run pytest -q
