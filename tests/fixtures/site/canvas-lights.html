<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta name="description" content="A 3D view">
<title>A night stage with a few lights</title>
<style>
  body { margin: 0; background: #0b0b10; color: #ddd; font: 16px/1.4 sans-serif; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .panel { position: fixed; left: 8px; bottom: 8px; padding: 8px; background: #050508; border: 1px solid #333; }
</style></head>
<body>
  <!-- A night stage: near black, with four lamps (Twilight's lights stage 12, 2 Nov). Each lamp sits on one of the
       points QAJev reads, so 4 of about 380 points are lit and the rest are one dark colour. -->
  <canvas id="view"></canvas>
  <div class="panel">Stage 12 of 14: the hall stands</div>
  <script>
    const c = document.getElementById('view'), g = c.getContext('2d');
    c.width = innerWidth; c.height = innerHeight;
    g.fillStyle = '#020203'; g.fillRect(0, 0, c.width, c.height);
    for (const [i, j] of [[5, 3], [12, 8], [18, 5], [8, 11]]) {  // a lamp, with its glow, on a sample point
      const x = c.width * (i + 0.5) / 24, y = c.height * (j + 0.5) / 16;
      const glow = g.createRadialGradient(x, y, 0, x, y, 18);
      glow.addColorStop(0, '#fff6d8'); glow.addColorStop(0.5, '#ffd27a'); glow.addColorStop(1, 'rgba(255,210,122,0)');
      g.fillStyle = glow; g.fillRect(x - 18, y - 18, 36, 36);
    }
  </script>
</body>
</html>
