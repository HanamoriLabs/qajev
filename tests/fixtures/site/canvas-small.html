<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta name="description" content="A small canvas">
<title>A small dark canvas</title>
<style>
  body { margin: 0; background: #f4f1ea; color: #222; font: 16px/1.4 sans-serif; }
  canvas { position: fixed; left: 0; top: 0; width: 40vw; height: 40vh; display: block; background: #0b0b10; }
  p { position: fixed; right: 16px; bottom: 16px; margin: 0; }
</style></head>
<body>
  <!-- A dark canvas that covers 16% of the view: under the fifth that CANVAS_POINTS reads, so it is no 3D view. -->
  <canvas id="view"></canvas>
  <p>the thumbnail stands</p>
</body>
</html>
