<!doctype html><meta charset="utf-8"><title>black frame</title>
<style>html,body{margin:0;background:#888} canvas{display:block;width:100vw;height:100vh}</style>
<canvas id="view" width="320" height="200"></canvas>
<script>
// Clears to opaque black in every frame and draws nothing else: a black-frame fault.
const gl = document.getElementById('view').getContext('webgl', {alpha: false, preserveDrawingBuffer: false});
function paint(r, g, b, a) { gl.clearColor(r, g, b, a); gl.clear(gl.COLOR_BUFFER_BIT); }
(function frame() { paint(0, 0, 0, 1); requestAnimationFrame(frame); })();
</script>
