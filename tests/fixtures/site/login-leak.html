<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta name="description" content="Sign in">
<title>Sign in</title></head>
<body>
  <h1>Sign in</h1>
  <form id="signin">
    <label>Email <input type="email" name="email" autocomplete="username"></label>
    <label>Password <input type="password" name="password" autocomplete="current-password"></label>
    <button type="submit">Sign in</button>
  </form>
  <form id="second" hidden>
    <label>Code from your authenticator <input name="code" autocomplete="one-time-code" inputmode="numeric"
      maxlength="6" placeholder="000000"></label>
    <button type="submit">Verify</button>
  </form>
  <p id="error" role="alert"></p>
  <script>
    // A careless app, for QAJev's own tests: it keeps what was typed (email, password, the one-time code) and
    // leak.html prints it all. QAJev's reports must still show none of it (tests/test_fresh_chrome_live.py).
    signin.onsubmit = (e) => {
      e.preventDefault();
      localStorage.leak_email = signin.email.value;
      localStorage.leak_password = signin.password.value;
      signin.hidden = true; second.hidden = false;
    };
    second.onsubmit = async (e) => {
      e.preventDefault();
      const r = await fetch('/api/totp', { method: 'POST', body: JSON.stringify({ code: second.code.value }) });
      if ((await r.json()).ok) {
        localStorage.leak_code = second.code.value;
        document.cookie = 'qajev_fixture_session=tester; path=/';
        location.href = '/leak.html';
      } else {
        error.textContent = 'That code is not right';
      }
    };
  </script>
</body>
</html>
