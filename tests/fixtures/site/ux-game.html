<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta name="description" content="A game's title screen">
<title>A game's title screen</title>
<style>
  body { margin: 0; font: 16px/1.4 sans-serif; color: #111; background: #fff; }
  /* A screen-reader live region, hidden on purpose: not text anyone sees, so never "cut off". */
  .sr-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #title-press { position: absolute; top: 120px; left: 80px; font-size: 20px; }
  /* The boot splash: opaque and over everything, so the title's button under it is not seen overlapping its name. */
  .splash { position: fixed; inset: 0; background: #0b0b0d; z-index: 100; }
  .splash .name { position: absolute; top: 120px; left: 80px; font-size: 20px; color: #e8e6e3; }
</style></head>
<body>
  <h1>I'M HIM!</h1>
  <div id="dev-menu" style="display:none"><h1>Dev menu</h1></div>
  <button id="title-press">PRESS ANY KEY</button>
  <div class="splash"><div class="name">Hanamori Labs</div><div class="sr-live" aria-live="polite">Hanamori Labs is loading</div></div>
  <script>
    // The game binds Tab (its inventory key) and cancels it, so focus never moves on Tab.
    addEventListener('keydown', (e) => { if (e.key === 'Tab') e.preventDefault(); });
  </script>
</body>
</html>
