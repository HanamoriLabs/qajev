<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UX fixture: small target and cut-off label</title>
<!--
  QAJev UX fixture: ux-tap-target.html
  Viewport: 390x844, mobile.
  Planted fault (one sheet, two parts):
    1. The close button is 24x24 px.
    2. The main button is 180 px wide with a one-line label that ends in an ellipsis.
  Steps: none (open the page and let it settle).
  Expected findings: exactly 2.
    UX-TAP   button "Close" is 24x24 px. Make the tap area at least 44x44 px.
    UX-CLIP  The label of button "Print sticker sheet for all selected cards" is cut off with "…"
             (shows about 50% of "Print sticker sheet for all selected cards").
             The exact percent depends on the font. It must be under 100.
  Nothing else is wrong: the other targets are 44 px or more, nothing is covered, no input.
-->
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #0f1115; color: #e8eaf0;
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .screen {
    min-height: 100%; max-width: 390px; margin: 0 auto; box-sizing: border-box;
    padding: 16px; display: flex; flex-direction: column; justify-content: flex-end;
  }
  .sheet {
    background: #1a1d24; border: 1px solid #2a2f3a; border-radius: 16px;
    padding: 16px; display: flex; flex-direction: column; gap: 16px;
  }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h2 { font-size: 18px; margin: 0; }
  p { margin: 0; color: #a9b0c0; }
  /* Planted fault 1: a 24x24 close button. */
  .close {
    width: 24px; height: 24px; padding: 0; border: 0; border-radius: 6px;
    background: #2a2f3a; color: #e8eaf0; font-size: 16px; line-height: 24px;
  }
  .actions { display: flex; gap: 12px; align-items: center; }
  .btn {
    min-height: 52px; border: 0; border-radius: 12px;
    background: #3b82f6; color: #fff; font: 600 16px/1.2 system-ui, sans-serif; padding: 0 12px;
  }
  .btn.secondary { background: #232836; color: #e8eaf0; border: 1px solid #2a2f3a; min-width: 96px; }
  /* Planted fault 2: the main label does not fit and is cut with an ellipsis. */
  .btn.cut { width: 180px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
  <div class="screen">
    <section class="sheet" aria-label="Sticker sheet">
      <div class="sheet-head">
        <h2>Sticker sheet</h2>
        <button id="close" class="close" type="button" aria-label="Close">×</button>
      </div>
      <p>12 cards are selected. Each card gets one sticker with its name and price.</p>
      <div class="actions">
        <button id="cancel" class="btn secondary" type="button">Back</button>
        <button id="print" class="btn cut" type="button">Print sticker sheet for all selected cards</button>
      </div>
    </section>
  </div>
</body>
</html>
